<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12151B">
<title>PistPejl – privat demo</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#12151B;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
main{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:380px}
.lockup{display:flex;align-items:center;gap:10px}
.lockup img{display:block}
.tl{color:#FC2726;font-weight:800;margin:14px 0 0}
h1{font-size:26px;margin:28px 0 6px;font-weight:900}
p.t{color:#C8CDD6;margin:0 0 16px;font-size:16px}
label.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input[type=password]{width:100%;font-size:17px;padding:14px 16px;border-radius:14px;border:1px solid #2C313C;background:#1C2029;color:#fff}
.rem{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:15px;cursor:pointer}
.rem input{width:22px;height:22px;accent-color:#E01F1E;margin:0}
button{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:14px;background:#E01F1E;color:#fff;font-size:17px;font-weight:800;cursor:pointer}
button:disabled{opacity:.7}
.err{color:#FF8A87;font-weight:700;margin:12px 0 0;min-height:1.2em}
:focus-visible{outline:3px solid #FFC400;outline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="lockup"><img src="/landing/brand/web-mark-light.png" width="49" height="56" alt=""><img src="/landing/brand/web-wordmark-light.png" width="140" height="40" alt="PistPejl"></div>
    <p class="tl">Håll koll. Hitta rätt. Va trygg.</p>
    <p id="busy" class="t" style="margin-top:28px" hidden>Låser upp…</p>
    <form id="f" hidden>
      <h1>Privat demo</h1>
      <p class="t">Ange lösenordet för att öppna PistPejl.</p>
      <label class="sr" for="pw">Lösenord</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Lösenord" required autofocus>
      <label class="rem"><input id="rem" type="checkbox" checked> Kom ihåg mig på den här enheten</label>
      <p id="err" class="err" role="alert"></p>
      <button id="go" type="submit">Lås upp</button>
    </form>
    <noscript><p class="t">JavaScript behövs för att låsa upp sidan.</p></noscript>
  </div>
</main>

  var S=crypto.subtle,E=new TextEncoder();
  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return('0'+x.toString(16)).slice(-2);}).join('');}
  function tokenFor(pw){return S.digest('SHA-256',E.encode('pistpejl-site:'+pw.trim())).then(hex);}
  function decrypt(t){

  }

  var f=document.getElementById('f'),busy=document.getElementById('busy'),err=document.getElementById('err'),pw=document.getElementById('pw'),go=document.getElementById('go');
  function ask(){busy.hidden=true;f.hidden=false;pw.focus();}
  var saved=get(localStorage)||get(sessionStorage);
