<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#12151B;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
main{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:380px}
.lockup{display:flex;align-items:center;gap:10px}
.lockup img{display:block}
.tl{color:#FC2726;font-weight:800;margin:14px 0 0}
h1{font-size:26px;margin:28px 0 6px;font-weight:900}
p.t{color:#C8CDD6;margin:0 0 16px;font-size:16px}
label.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input[type=password]{width:100%;font-size:17px;padding:14px 16px;border-radius:14px;border:1px solid #2C313C;background:#1C2029;color:#fff}
.rem{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:15px;cursor:pointer}
.rem input{width:22px;height:22px;accent-color:#E01F1E;margin:0}
button{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:14px;background:#E01F1E;color:#fff;font-size:17px;font-weight:800;cursor:pointer}
button:disabled{opacity:.7}
.err{color:#FF8A87;font-weight:700;margin:12px 0 0;min-height:1.2em}
:focus-visible{outline:3px solid #FFC400;outline-offset:3px}
[hidden]{display:none!important}
.top{display:flex;justify-content:flex-end;margin-bottom:14px}
.lang{display:inline-flex;border:1.5px solid #2C313C;border-radius:999px;padding:2px;background:#1C2029}
.lang button{width:auto;min-height:36px;margin:0;font-size:13px;font-weight:800;color:#C8CDD6;background:none;border-radius:999px;padding:7px 11px;min-width:40px}
.lang button[aria-pressed="true"]{background:#E01F1E;color:#fff}
</style>

  var LK='pistpejl_lang',L;
  function getL(){try{var x=localStorage.getItem(LK);if(x==='sv'||x==='en')return x;}catch(e){}return /^sv/i.test(navigator.language||'')?'sv':'en';}
  function setL(l){
    L=l;document.documentElement.lang=l;
    Array.prototype.forEach.call(document.querySelectorAll('[data-en]'),function(el){if(!el.hasAttribute('data-sv'))el.setAttribute('data-sv',el.textContent);el.textContent=l==='en'?el.getAttribute('data-en'):el.getAttribute('data-sv');});
    var p=document.getElementById('pw');if(p){if(!p.hasAttribute('data-sv-placeholder'))p.setAttribute('data-sv-placeholder',p.placeholder);p.placeholder=l==='en'?p.getAttribute('data-en-placeholder'):p.getAttribute('data-sv-placeholder');}
    var er=document.getElementById('err');if(er&&er.textContent)er.textContent=MSG();
    Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-l')===l?'true':'false');});
  }
  function MSG(){return L==='en'?'Wrong password. Try again.':'Fel lösenord. Försök igen.';}
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){b.addEventListener('click',function(){var l=b.getAttribute('data-l');try{localStorage.setItem(LK,l);}catch(e){}setL(l);});});
  setL(getL());
  var S=crypto.subtle,E=new TextEncoder();
  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return('0'+x.toString(16)).slice(-2);}).join('');}
  function tokenFor(pw){return S.digest('SHA-256',E.encode('pistpejl-site:'+pw.trim())).then(hex);}
  function decrypt(t){
    return S.importKey('raw',E.encode(t),'PBKDF2',false,['deriveKey'])
      .then(function(b){return S.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(k){return S.decrypt({name:'AES-GCM',iv:u8(IV)},k,u8(CT));})
      .then(function(p){return new TextDecoder().decode(p);});
  }
  function get(s){try{return s.getItem(K);}catch(e){return null;}}
  function show(html){document.open();document.write(html);document.close();}
  var f=document.getElementById('f'),busy=document.getElementById('busy'),err=document.getElementById('err'),pw=document.getElementById('pw'),go=document.getElementById('go');
  function ask(){busy.hidden=true;f.hidden=false;pw.focus();}
  var saved=get(localStorage)||get(sessionStorage);
  if(saved){busy.hidden=false;decrypt(saved).then(show,ask);}else ask();
  f.addEventListener('submit',function(e){
    e.preventDefault();go.disabled=true;err.textContent='';
    var t;
    tokenFor(pw.value).then(function(x){t=x;return decrypt(t);}).then(function(html){

      show(html);
    },function(){go.disabled=false;pw.value='';err.textContent=MSG();pw.focus();});
  });
